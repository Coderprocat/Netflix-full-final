<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Netflix - Sign In</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="responsive.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="overlay"></div>

    <!-- Header -->
    <header>

        <a href="index.html">
            <img src="Netflix-Logo-PNG-File.png" alt="Netflix Logo" class="logo">
        </a>

    </header>

    <!-- Login Box -->
    <div class="login-container">

        <h1>Sign In</h1>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Email address"
                autocomplete="email"
                required>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required>

            <button type="submit">
                Sign In
            </button>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#">
                    Need help?
                </a>

            </div>

        </form>

        <p class="signup">

            New to Netflix?

            <a href="signup.html">
                Sign up now.
            </a>

        </p>

        <small>
            This page is protected by Google reCAPTCHA to ensure you're not a bot.
        </small>

    </div>

    <script src="login.js"></script>

</body>

</html>
