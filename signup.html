<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Sign Up</title>

    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <!-- Background Overlay -->
    <div class="overlay"></div>

    <!-- Netflix Logo -->
    <a href="index.html">
        <img src="Netflix-Logo-PNG-File.png" alt="Netflix Logo" class="logo">
    </a>

    <!-- Signup Container -->
    <div class="signup-container">

        <h1>Sign Up</h1>

        <form id="signupForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Sign In</a>
        </p>

    </div>

    <script src="signup.js"></script>

</body>
</html>
