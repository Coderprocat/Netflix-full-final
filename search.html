<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Netflix Search</title>

    <link rel="stylesheet" href="search.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ==========================
        NAVBAR
=========================== -->

<nav class="navbar">

    <a href="home.html">

        <img src="Netflix-Logo-PNG-File.png"
             class="logo">

    </a>

    <div class="search-container">

        <i class="fa-solid fa-search"></i>

        <input
            type="text"
            id="searchInput"
            placeholder="Search movies...">

    </div>

    <button
        class="back-btn"
        onclick="window.location='home.html'">

        Home

    </button>

</nav>

<!-- ==========================
        HEADER
=========================== -->

<section class="header">

    <h1>

        Search Movies

    </h1>

    <p>

        Discover your favorite movies.

    </p>

</section>

<!-- ==========================
        CATEGORY FILTER
=========================== -->

<section class="filter">

<select id="category">

<option value="all">

All Categories

</option>

<option value="Action">

Action

</option>

<option value="Series">

Series

</option>

<option value="Romance">

Romance

</option>

<option value="Comedy">

Comedy

</option>

<option value="Sci-Fi">

Sci-Fi

</option>

<option value="Horror">

Horror

</option>

</select>

</section>

<!-- ==========================
        RESULTS
=========================== -->

<section class="movies">

<div
class="movie-grid"
id="movieGrid">

<!-- Generated by search.js -->

</div>

</section>
<!-- ==========================
        FOOTER
=========================== -->

<footer>

<p>

Netflix Clone © 2026

</p>

</footer>

<script src="movies.js"></script>
<script src="app.js"></script>
<script src="search.js"></script>

</body>

</html>
